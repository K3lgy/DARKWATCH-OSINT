version: "3.9"

# ─────────────────────────────────────────────────────────────
# DARKWATCH OSINT Platform — Stack complète
# Usage : docker compose up -d
# ─────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: darkwatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-darkwatch}
      POSTGRES_USER: ${DB_USER:-osint_user}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-osint_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Elasticsearch ─────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: darkwatch_es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: darkwatch_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama (LLM local) ────────────────────────────────────
  ollama:
    image: ollama/ollama
    container_name: darkwatch_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # Pour GPU NVIDIA : décommentez les lignes suivantes
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ─── AI Worker ─────────────────────────────────────────────
  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: darkwatch_ai_worker
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - REDIS_URL=redis://redis:6379
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ─── Interface Web ─────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: darkwatch_web
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - postgres
      - redis

volumes:
  pg_data:
    driver: local
  es_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
